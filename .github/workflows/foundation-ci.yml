name: Foundation CI
on:
  push:
    branches: ['feat/p0a-*', 'main']
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
          run_install: false
      - name: Verify frozen pnpm lockfile
        run: pnpm install --frozen-lockfile
      - name: P0A-T01 Python layout tests
        run: python3 -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: P0A-T01 Node package layout tests
        run: node --test tests/node/*.test.mjs
      - name: Existing architecture documentation validation
        run: |
          python3 scripts/validate_docs.py
          python3 scripts/validate_phased_docs.py
      - name: Make check aggregate
        run: make check
